<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Olyvex — nouveau mot de passe</title>
<style>body{margin:0;background:#f5f6fa;color:#263249;font:17px system-ui}main{max-width:420px;margin:10vh auto;padding:30px;background:white;border:1px solid #dde2ee;border-radius:18px}label{display:block;margin-top:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:8px;border-radius:9px;border:1px solid #bac5dc;font:inherit}button{background:#7444d5;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#6537b8}p{line-height:1.5}@media(max-width:500px){main{margin:24px 14px}}</style></head>
<body><main><h1>Nouveau mot de passe</h1><p>Choisissez un mot de passe de 10 à 128 caractères pour votre compte Olyvex.</p>
<form id="reset"><label for="password">Nouveau mot de passe</label><input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
<label for="confirm">Confirmer le mot de passe</label><input id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><button>Enregistrer le mot de passe</button></form>
<p id="status" role="status" aria-live="polite"></p><a href="/">Retour à la connexion</a></main>
<script>
(()=>{'use strict';let token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);
const form=document.getElementById('reset'),status=document.getElementById('status'),button=form.querySelector('button');
if(!/^[a-f0-9]{64}$/.test(token)){form.hidden=true;status.textContent='Lien invalide. Demandez un nouveau lien depuis la connexion.';return;}
form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value;
if(password!==document.getElementById('confirm').value){status.textContent='Les deux mots de passe doivent être identiques.';return;}
button.disabled=true;status.textContent='Enregistrement en cours…';try{const response=await fetch('/api/auth/reset-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const data=await response.json();if(!response.ok)throw Error(data.error||'Réessayez plus tard.');token='';form.reset();form.hidden=true;status.textContent=data.message;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
})();
</script></body></html>
