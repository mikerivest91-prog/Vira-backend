<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Olyvex — récupération du compte</title><style>body{margin:0;background:#f5f6fa;color:#263249;font:17px system-ui}main{max-width:420px;margin:10vh auto;padding:30px;background:white;border:1px solid #dde2ee;border-radius:18px}label{display:block}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0 20px;border-radius:9px;border:1px solid #bac5dc;font:inherit}button{background:#7444d5;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#6537b8}p{line-height:1.5}@media(max-width:500px){main{margin:24px 14px}}</style></head><body><main><h1>Mot de passe oublié?</h1><p>Entrez l’adresse courriel de votre compte pour recevoir un lien de récupération valable 15 minutes.</p><form id="forgot"><label for="email">Adresse courriel</label><input id="email" type="email" autocomplete="email" maxlength="254" required><button>Envoyer le lien</button></form><p role="status" aria-live="polite" id="status"></p><a href="/">Retour à la connexion</a></main><script>(()=>{'use strict';const form=document.getElementById('forgot'),status=document.getElementById('status'),button=form.querySelector('button');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='Demande en cours…';try{const response=await fetch('/api/auth/forgot-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Réessayez plus tard.');status.textContent=data.message;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});})();</script></body></html>
