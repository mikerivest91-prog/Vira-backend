<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <title>VIRA Marketing IA</title>
  <style>
    :root {
      --bg: #050507;
      --panel: #0d0b14;
      --panel-2: #0a0910;
      --panel-3: #11101a;
      --text: #f8f7ff;
      --muted: #9d98aa;
      --muted-2: #777183;
      --line: rgba(168, 85, 247, 0.22);
      --line-strong: rgba(192, 132, 252, 0.48);
      --purple: #a855f7;
      --purple-2: #7c3aed;
      --blue: #3b82f6;
      --green: #22c55e;
      --orange: #f59e0b;
      --pink: #ec4899;
      --danger: #fb7185;
      --radius-xl: 24px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --shadow: 0 20px 55px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% -8%, rgba(124, 58, 237, 0.18), transparent 34%),
        radial-gradient(circle at 90% 5%, rgba(37, 99, 235, 0.10), transparent 28%),
        var(--bg);
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app-shell { min-height: 100vh; }

    .desktop-sidebar {
      display: none;
      position: fixed;
      inset: 0 auto 0 0;
      width: 250px;
      padding: 28px 18px;
      border-right: 1px solid rgba(255,255,255,0.06);
      background: rgba(7, 7, 11, 0.88);
      backdrop-filter: blur(18px);
      z-index: 20;
    }

    .sidebar-logo, .vira-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .vira-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      font-size: 23px;
      font-weight: 950;
      background: linear-gradient(135deg, #9333ea, #2563eb);
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.32);
    }

    .logo {
      font-size: 27px;
      font-weight: 950;
      letter-spacing: 1.7px;
      line-height: 1;
      background: linear-gradient(135deg, #fff 10%, #c4b5fd 56%, #60a5fa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 5px;
      color: #888395;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
    }

    .sidebar-nav {
      display: grid;
      gap: 8px;
      margin-top: 34px;
    }

    .sidebar-link {
      width: 100%;
      margin: 0;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: #aaa4b6;
      background: transparent;
      text-align: left;
      font-weight: 750;
      cursor: pointer;
    }

    .sidebar-link.active {
      color: #fff;
      border-color: rgba(168,85,247,.22);
      background: rgba(124,58,237,.12);
    }

    .main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 16px 80px;
    }

    .vira-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .credit-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      padding: 9px 11px;
      border-radius: 13px;
      border: 1px solid rgba(139,92,246,.30);
      background: rgba(14, 13, 21, 0.84);
      color: #f5f3ff;
      font-size: 12px;
      font-weight: 850;
    }

    .credit-badge small {
      color: #858091;
      font-size: 9px;
      font-weight: 650;
    }

    .welcome-block { margin: 8px 0 20px; }

    .welcome-block h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 36px);
      line-height: 1.08;
      letter-spacing: -.7px;
      font-weight: 950;
    }

    .welcome-block p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .glass-card {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at top right, rgba(139,92,246,.12), transparent 38%),
        linear-gradient(145deg, rgba(14,12,21,.97), rgba(8,8,12,.98));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.035);
    }

    .brain-card { padding: 18px; }

    .brain-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      color: #b78afc;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .brain-title {
      margin-top: 5px;
      font-size: 21px;
      font-weight: 950;
      letter-spacing: -.35px;
    }

    .brain-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .score-ring {
      --score-deg: 259deg;
      width: 78px;
      height: 78px;
      flex: 0 0 78px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle, #0b0a10 57%, transparent 59%),
        conic-gradient(#a855f7 0deg var(--score-deg), rgba(255,255,255,.08) var(--score-deg) 360deg);
      box-shadow: 0 0 26px rgba(168,85,247,.22);
    }

    .score-ring strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      text-align: center;
    }

    .score-ring small {
      display: block;
      margin-top: 3px;
      color: #8c8795;
      font-size: 9px;
      text-align: center;
    }

    .brain-grid {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .brain-insight {
      padding: 12px 13px;
      border-radius: 15px;
      border: 1px solid rgba(168,85,247,.12);
      background: rgba(139,92,246,.055);
      color: #d6d1df;
      font-size: 12px;
      line-height: 1.5;
    }

    .brain-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }

    .brain-actions span {
      color: #aaa4b6;
      font-size: 11px;
    }

    .brain-btn {
      width: auto;
      margin: 0;
      padding: 8px 11px;
      border: 1px solid rgba(192,132,252,.26);
      border-radius: 999px;
      color: #d8b4fe;
      background: rgba(139,92,246,.09);
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
    }

    .workspace-card {
      margin-top: 16px;
      padding: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 5px 0 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
    }

    .section-title .number {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 9px;
      border: 1px solid rgba(168,85,247,.28);
      background: rgba(124,58,237,.10);
      color: #c4b5fd;
      font-size: 12px;
    }

    .section-help {
      margin: -5px 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .marketing-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .marketing-choice {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 154px;
      margin: 0;
      padding: 14px 10px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(148,163,184,.15);
      border-radius: 19px;
      background: linear-gradient(145deg,#0d0b14,#08070c);
      color: #fff;
      text-align: center;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
      transition: transform .17s ease, border-color .17s ease, box-shadow .17s ease;
    }

    .marketing-choice:active {
      transform: scale(.985);
    }

    .marketing-choice.active {
      border-color: rgba(192,132,252,.88);
      background:
        radial-gradient(circle at 50% 13%, rgba(168,85,247,.20), transparent 56%),
        linear-gradient(145deg,#15101f,#0a080f);
      box-shadow:
        0 0 0 1px rgba(168,85,247,.12),
        0 12px 30px rgba(124,58,237,.16);
    }

    .choice-icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(168,85,247,.055);
      border: 1px solid rgba(168,85,247,.14);
    }

    .choice-icon svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .launch { color: #b36aff; }
    .brand { color: #38bdf8; }
    .leads { color: #4ade80; }
    .sale { color: #fb923c; }

    .choice-title {
      font-size: 13px;
      font-weight: 900;
      line-height: 1.16;
    }

    .choice-description {
      color: #918b9a;
      font-size: 10px;
      line-height: 1.35;
    }

    .choice-check {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      width: 23px;
      height: 23px;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg,#c084fc,#7c3aed);
      font-size: 12px;
      font-weight: 950;
      box-shadow: 0 0 14px rgba(168,85,247,.30);
    }

    .marketing-choice.active .choice-check {
      display: grid;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field-group {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field-group label {
      color: #ded9e8;
      font-size: 12px;
      font-weight: 800;
    }

    .field-group input,
    .field-group textarea,
    .field-group select {
      width: 100%;
      border: 1px solid rgba(168,85,247,.25);
      border-radius: 17px;
      outline: none;
      color: #f8fafc;
      background: linear-gradient(145deg,#0d0b14,#08070c);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
      transition: border-color .17s ease, box-shadow .17s ease;
    }

    .field-group input,
    .field-group select {
      height: 49px;
      padding: 0 14px;
    }

    .field-group textarea {
      min-height: 122px;
      resize: vertical;
      padding: 14px 14px 31px;
      line-height: 1.5;
    }

    .field-group input::placeholder,
    .field-group textarea::placeholder {
      color: #6e6878;
    }

    .field-group input:focus,
    .field-group textarea:focus,
    .field-group select:focus {
      border-color: rgba(168,85,247,.86);
      box-shadow: 0 0 0 3px rgba(139,92,246,.10);
    }

    select {
      color-scheme: dark;
    }

    .char-count {
      position: absolute;
      right: 12px;
      bottom: 9px;
      color: #736d7e;
      font-size: 10px;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: 21px;
      height: 21px;
      color: #a855f7;
      pointer-events: none;
      z-index: 2;
    }

    .field-icon svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .with-icon select {
      padding-left: 45px;
    }

    .platform-tip {
      display: none;
      margin-top: -2px;
      padding: 10px 12px;
      border: 1px solid rgba(168,85,247,.18);
      border-radius: 14px;
      background: rgba(124,58,237,.055);
      color: #aaa4b6;
      font-size: 11px;
      line-height: 1.45;
    }

    .primary-cta,
    .action-card {
      width: 100%;
      border: 0;
      color: #fff;
      cursor: pointer;
    }

    .primary-cta {
      min-height: 61px;
      margin-top: 17px;
      padding: 0 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid rgba(192,132,252,.44);
      border-radius: 18px;
      background: linear-gradient(135deg,#7c3aed 0%,#9333ea 48%,#2563eb 100%);
      box-shadow:
        0 13px 30px rgba(124,58,237,.26),
        inset 0 1px 0 rgba(255,255,255,.13);
      font-size: 15px;
      font-weight: 900;
    }

    .primary-cta:active,
    .action-card:active {
      transform: scale(.988);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none !important;
    }

    .status-box:empty {
      display: none;
    }

    .status-box {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid rgba(168,85,247,.18);
      border-radius: 15px;
      background: rgba(124,58,237,.055);
      color: #c9c3d4;
      font-size: 12px;
      line-height: 1.45;
    }

    .status-box.error {
      border-color: rgba(251,113,133,.28);
      background: rgba(251,113,133,.06);
      color: #fecdd3;
    }

    .status-box.success {
      border-color: rgba(34,197,94,.26);
      background: rgba(34,197,94,.055);
      color: #bbf7d0;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .loader-star {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #d8b4fe;
      background: rgba(168,85,247,.13);
      border: 1px solid rgba(192,132,252,.25);
      animation: pulse 1.35s ease-in-out infinite;
    }

    .loader-dots {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .loader-dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c084fc;
      animation: dot 1.1s infinite ease-in-out;
    }

    .loader-dots i:nth-child(2) {
      animation-delay: .13s;
    }

    .loader-dots i:nth-child(3) {
      animation-delay: .26s;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 18px rgba(168,85,247,.25);
      }
    }

    @keyframes dot {
      0%,80%,100% {
        opacity:.3;
        transform: translateY(0);
      }

      40% {
        opacity:1;
        transform: translateY(-3px);
      }
    }

    .campaign-result:empty {
      display: none;
    }

    .campaign-result {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid rgba(168,85,247,.20);
      border-radius: 20px;
      background: linear-gradient(145deg,rgba(17,15,27,.98),rgba(8,8,13,.98));
      box-shadow: 0 16px 40px rgba(0,0,0,.28);
    }

    .result-ready {
      margin-bottom: 14px;
      padding: 12px 13px;
      border-radius: 14px;
      border: 1px solid rgba(34,197,94,.18);
      background: rgba(34,197,94,.055);
    }

    .result-ready strong {
      display:block;
      font-size: 13px;
    }

    .result-ready span {
      display:block;
      margin-top:3px;
      color:#9e98a9;
      font-size:11px;
    }

    .campaign-result h2 {
      margin: 0 0 13px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -.4px;
      background: linear-gradient(135deg,#fff,#c4b5fd 56%,#60a5fa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .campaign-section {
      margin-top: 9px;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid rgba(168,85,247,.11);
      background: rgba(255,255,255,.022);
    }

    .campaign-section strong,
    .campaign-section summary {
      color:#f7f5ff;
      font-size:12px;
      font-weight:900;
    }

    .campaign-section p {
      margin:7px 0 0;
      color:#c7c2d0;
      font-size:12px;
      line-height:1.55;
      white-space:pre-line;
    }

    details summary {
      cursor:pointer;
      list-style:none;
    }

    details summary::-webkit-details-marker {
      display:none;
    }

    details summary::after {
      content:"＋";
      float:right;
      color:#a855f7;
    }

    details[open] summary::after {
      content:"−";
    }

    .scene-item {
      padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .scene-item:last-child {
      border-bottom:0;
    }

    .workflow-actions {
      display:grid;
      gap:10px;
      margin-top:13px;
    }

    .action-card {
      min-height: 70px;
      margin:0;
      padding: 12px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      border-radius:17px;
      text-align:left;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        0 10px 25px rgba(0,0,0,.18);
    }

    .action-card .action-icon {
      width:40px;
      height:40px;
      flex:0 0 40px;
      display:grid;
      place-items:center;
      border-radius:13px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.15);
      font-size:19px;
    }

    .action-card .action-copy {
      flex:1;
      min-width:0;
    }

    .action-card .action-copy strong {
      display:block;
      font-size:14px;
    }

    .action-card .action-copy span {
      display:block;
      margin-top:3px;
      color:rgba(255,255,255,.72);
      font-size:11px;
      line-height:1.3;
    }

    .action-card .chev {
      font-size:25px;
      opacity:.75;
    }

    .validate {
      background:linear-gradient(135deg,rgba(5,110,55,.92),rgba(3,65,45,.95));
      border:1px solid rgba(34,197,94,.50);
    }

    .voice {
      background:linear-gradient(135deg,rgba(2,132,199,.86),rgba(37,99,235,.84));
      border:1px solid rgba(56,189,248,.42);
    }

    .visuals {
      background:linear-gradient(135deg,rgba(245,158,11,.90),rgba(234,88,12,.84));
      border:1px solid rgba(251,146,60,.40);
    }

    .video {
      background:linear-gradient(135deg,rgba(109,40,217,.90),rgba(76,29,149,.90));
      border:1px solid rgba(192,132,252,.37);
    }

    .progress-wrap {
      display:none;
      margin-top:12px;
    }

    .progress-meta {
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-bottom:7px;
      color:#b8b1c4;
      font-size:11px;
    }

    .progress-track {
      height:8px;
      overflow:hidden;
      border-radius:999px;
      background:#15131d;
      border:1px solid rgba(255,255,255,.05);
    }

    .progress-fill {
      width:0%;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,#7c3aed,#a855f7,#3b82f6);
      transition:width .3s ease;
    }

    .visual-results:empty,
    .video-result:empty {
      display:none;
    }

    .results-panel {
      margin-top: 13px;
      padding: 14px;
      border:1px solid rgba(168,85,247,.18);
      border-radius:19px;
      background:linear-gradient(145deg,#100e18,#09080e);
    }

    .results-panel h3 {
      margin:0;
      font-size:14px;
    }

    .results-panel .meta {
      margin-top:3px;
      color:#8e8799;
      font-size:10px;
    }

    .visual-strip {
      display:flex;
      gap:10px;
      margin-top:12px;
      padding-bottom:7px;
      overflow-x:auto;
      overscroll-behavior-inline:contain;
      scroll-snap-type:x mandatory;
      scrollbar-width:thin;
    }

    .visual-card {
      flex:0 0 142px;
      width:142px;
      scroll-snap-align:start;
    }

    .visual-frame {
      position:relative;
      width:100%;
      aspect-ratio:9/16;
      overflow:hidden;
      border-radius:15px;
      border:1px solid rgba(168,85,247,.18);
      background:#0a0810;
    }

    .visual-frame img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .visual-number {
      position:absolute;
      top:7px;
      left:7px;
      padding:5px 7px;
      border-radius:9px;
      background:rgba(5,5,8,.72);
      border:1px solid rgba(255,255,255,.09);
      font-size:9px;
      font-weight:850;
    }

    .visual-caption {
      margin-top:7px;
            <div class="section-title" style="margin-top:24px">
          <span class="number">2</span>
          <span>Informations</span>
        </div>

        <div class="form-grid">
          <div class="field-group">
            <label for="prompt">Description du produit / service</label>

            <textarea
              id="prompt"
              maxlength="500"
              placeholder="Décrivez votre produit, votre service ou votre offre en quelques mots..."
            ></textarea>

            <div class="char-count">
              <span id="promptCount">0</span>/500
            </div>
          </div>
        </div>

    function extractSection(
      text,
      heading,
      allHeadings
    ) {

      const escaped =
        heading
          .replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
          )
          .replace(
            /'/g,
            "['’]"
          );

      const others =
        allHeadings
          .filter(
            (h) => h !== heading
          )
          .map(
            (h) =>
              h
                .replace(
                  /[.*+?^${}()|[\]\\]/g,
                  "\\$&"
                )
                .replace(
                  /'/g,
                  "['’]"
                )
          )
          .join("|");

      const re =
        new RegExp(
          `${escaped}\\s*:?\\s*([\\s\\S]*?)(?=\\n\\s*(?:${others})\\s*:?|$)`,
          "i"
        );

      return (
        text.match(re)?.[1]?.trim() ||
        ""
      );
    }

    function parseScenario(text) {

      const clean =
        text
          .replace(
            /\*\*/g,
            ""

          .replace(
            /^#+\s*/gm,
            ""

          .replace(
            /SCENE/gi,
            "SCÈNE"
          )
          .trim();

      const headers = [
        "TITRE",
        "OBJECTIF",
        "PUBLIC CIBLE",
        "ACCROCHE",
        "TEXTE PUBLICATION",
        "HASHTAGS",
        "SCÈNE 1",

        "SCÈNE 3",
        "SCÈNE 4",
        "SCÈNE 5",
        "NARRATION",
        "APPEL À L'ACTION",
        "APPEL À L’ACTION",
        "PROMPT VISUEL",
        "STYLE"
      ];

      const data = {
        title:
          extractSection(
            clean,
            "TITRE",
            headers
          ),

        objective:
          extractSection(
            clean,
            "OBJECTIF",
            headers
          ),

        target:
          extractSection(
            clean,
            "PUBLIC CIBLE",
            headers
          ),

        hook:
          extractSection(
            clean,
            "ACCROCHE",
            headers
          ),

        publication:
          extractSection(
            clean,
            "TEXTE PUBLICATION",
            headers
          ),

        hashtags:
          extractSection(
            clean,
            "HASHTAGS",
            headers
          ),

        narration:
          extractSection(
            clean,
            "NARRATION",
            headers
          ),

        cta:
          extractSection(
            clean,
            "APPEL À L'ACTION",
            headers
          ) ||
          extractSection(
            clean,
            "APPEL À L’ACTION",
            headers
          ),

        visualPrompt:
          extractSection(
            clean,
            "PROMPT VISUEL",
            headers
          ),

        style:
          extractSection(
            clean,
            "STYLE",
            headers
          ),

        scenes: []
      };

      for (
        let i = 1;
        i <= 5;
        i++
      ) {
        data.scenes.push(
          extractSection(
            clean,
            `SCÈNE ${i}`,
            headers
          )
        );
      }

      return data;
    }

    async function generateRealImages(
      scenes,
      visualPrompt,
      style
    ) {

      const images = [];

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        setProgress(
          15 + i * 14,
          `Création du visuel ${i + 1}/5`
        );

        const prompt = `
          ${visualPrompt ||
          "Professional premium marketing visual"}.

          Scene ${i + 1}:
          ${scenes[i]}.

          Style:
          ${style ||
          els.tone.value}.

          Platform:
          ${els.platform.value}.

          Maintain visual continuity with the other scenes.
          No text or typography in the image.
        `;

        const response =
          await fetch(
            "/api/images/generate",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  prompt,
                  size:
                    "1024x1536",
                  quality:
                    "low"
                })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data?.error ||
            `Erreur visuel ${i + 1}`
          );
        }

        const url =
          data?.url ||
          data?.image?.url;

        if (!url) {

          throw new Error(
            `Aucune image reçue pour la scène ${i + 1}.`
          );
        }

        images.push(url);
      }

      return images;
    }

    async function waitForRunwayTask(
      taskId,
      sceneNumber
    ) {

      for (
        let attempt = 0;
        attempt < 90;
        attempt++
      ) {

        await new Promise(
          (r) =>
            setTimeout(
              r,
              5000
            )
        );

        const r =
          await fetch(
            `/api/video/${encodeURIComponent(
              taskId
            )}/status`
          );

        const d =
          await r.json();

        if (!r.ok) {

          throw new Error(
            d?.error ||
            `Erreur vidéo scène ${sceneNumber}`
          );
        }

        const status =
          String(
            d.status || ""
          ).toUpperCase();

        if (
          [
            "SUCCEEDED",
            "COMPLETED",
            "SUCCESS"
          ].includes(status)
        ) {

          const url =
            Array.isArray(
              d.output
            )
              ? d.output[0]
              : null;

          if (!url) {

            throw new Error(
              `Clip ${sceneNumber} terminé sans URL.`
            );
          }

          return url;
        }

        if (
          [
            "FAILED",
            "CANCELED",
            "CANCELLED"
          ].includes(status)
        ) {

          throw new Error(
            `La scène ${sceneNumber} a échoué.`
          );
        }

        setProgress(
          30 +
            Math.min(
              48,
              attempt * .7
            ),
          `Vidéo scène ${sceneNumber}/5 • ${
            d.status ||
            "en cours"
          }`
        );
      }

      throw new Error(
        `La scène ${sceneNumber} prend trop de temps.`
      );
    }

    async function createFinalVideo() {

      const d =
        parseScenario(
          rawScenario
        );

      setProgress(
        8,
        "Préparation des 5 scènes"
      );

      const start =
        await fetch(
          "/api/video/generate",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                prompt:
                  rawScenario,

                images:
                  generatedImages
              })
          }
        );

      const data =
        await start.json();

      if (!start.ok) {

        throw new Error(
          data?.error ||
          "Impossible de lancer la vidéo."
        );
      }

      const clips =
        Array.isArray(
          data.clips
        )
          ? data.clips
          : [];

      if (
        clips.length !== 5
      ) {

        throw new Error(
          "VIRA n’a pas reçu 5 clips vidéo."
        );
      }

      if (
        clips.some(
          (c) =>
            !c.taskId
        )
      ) {

        throw new Error(
          "Les clips sont préparés, mais Runway est encore en mode PREPARE sur le serveur. Active RUNWAY_EXECUTION=generate pour produire la vraie vidéo."
        );
      }

      const videoUrls = [];

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        videoUrls.push(
          await waitForRunwayTask(
            clips[i].taskId,
            i + 1
          )
        );
      }

      setProgress(
        82,
        "Assemblage des 5 clips"
      );

      const assemble =
        await fetch(
          "/api/video/assemble",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                videoUrls
              })
          }
        );

      if (!assemble.ok) {

        let msg =
          "Impossible d’assembler la vidéo.";

        try {
          const e =
            await assemble.json();

          msg =
            e?.error ||
            msg;

        } catch {}

        throw new Error(msg);
      }

      let videoBlob =
        await assemble.blob();

      const narration =
        d.narration.trim();

      if (narration) {

        setProgress(
          90,
          "Ajout de la narration"
        );

        const voice =
          await fetch(
            "/api/voice/generate",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  text:
                    narration
                })
            }
          );

        if (voice.ok) {

          const audioBlob =
            await voice.blob();

          const fd =
            new FormData();

          fd.append(
            "video",
            videoBlob,
            "vira-video.mp4"
          );

          fd.append(
            "audio",
            audioBlob,
            "vira-voice.mp3"
          );

          const merge =
            await fetch(
              "/api/video/merge",
              {
                method: "POST",
                body: fd
              }
            );

          if (merge.ok) {
            videoBlob =
              await merge.blob();
          }
        }
      }

      setProgress(
        100,
        "Vidéo terminée"
      );

      return (
        URL.createObjectURL(
          videoBlob
        )
      );
    }
