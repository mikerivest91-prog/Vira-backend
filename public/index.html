  //// ===============================
// SAUVEGARDE / RESTAURATION VIRA
// ===============================
  function getRawScenario() {
  return (
    scenarioResult.dataset.rawScenario ||
    scenarioResult.textContent ||
    ""
  ).trim();
}

function renderMarketingScenario(scenario) {
  scenarioResult.dataset.rawScenario = scenario;
const cleanScenario = scenario
  .replace(/\*\*/g, "")
  .replace(/^#+\s*/gm, "")
  .replace(/\s+:/g, ":")
  .replace(/SCENE/gi, "SCÈNE")
  .trim();
const sectionHeaders = [
  "TITRE",
  "OBJECTIF",
  "PUBLIC CIBLE",
  "ACCROCHE",
  "TEXTE PUBLICATION",
  "HASHTAGS",
  "SCÈNE 1",
  "SCÈNE 2",
  "SCÈNE 3",
  "SCÈNE 4",
  "SCÈNE 5",
  "NARRATION",
  "APPEL À L'ACTION",
  "APPEL À L’ACTION",
  "PROMPT VISUEL",
  "STYLE"
];

const escapeRegex = (text) =>
  text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

const extractSection = (name) => {
  const start = escapeRegex(name).replace(/'/g, "['’]");
  const nextHeaders = sectionHeaders
    .filter((header) => header !== name)
    .map((header) =>
      escapeRegex(header).replace(/'/g, "['’]")
     ) 
    .join("|");

  const regex = new RegExp(
    `${start}\\s*:?\\s*([\\s\\S]*?)(?=\\s+(?:${nextHeaders})\\s*:?|$)`
  );

  return cleanScenario.match(regex)?.[1]?.trim() || "";
};

const title = extractSection("TITRE", ["OBJECTIF"]);
const objective = extractSection("OBJECTIF", ["PUBLIC CIBLE"]);
const target = extractSection("PUBLIC CIBLE", ["ACCROCHE"]);
const hook = extractSection("ACCROCHE", ["TEXTE PUBLICATION"]);
const publication = extractSection("TEXTE PUBLICATION", ["HASHTAGS"]);
const hashtags = extractSection("HASHTAGS", ["SCÈNE 1"]);
const narration = extractSection("NARRATION", ["APPEL À L'ACTION"]);
const cta = extractSection("APPEL À L'ACTION", ["PROMPT VISUEL"]);
const visualPrompt = extractSection("PROMPT VISUEL", ["STYLE"]);
const style = extractSection("STYLE", []);

const scenes = [];

for (let i = 1; i <= 5; i++) {
  const regex = new RegExp(
    `SCÈNE ${i}:?\\s*([\\s\\S]*?)(?=SCÈNE ${i + 1}:?|NARRATION:?|APPEL À L['’]ACTION:?|PROMPT VISUEL:?|STYLE:?|$)`,
    "i"
  );

  const match = cleanScenario.match(regex);

  if (match?.[1]?.trim()) {
    scenes.push(match[1].trim());
  }
  }
scenarioResult.innerHTML = `

  </div>

  <summary>🎬 Scènes (${scenes.length})</summary>
