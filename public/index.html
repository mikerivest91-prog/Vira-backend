
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIRA Marketing IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 0%, rgba(124, 58, 237, 0.12), transparent 30%),
    radial-gradient(circle at 85% 10%, rgba(37, 99, 235, 0.08), transparent 28%),
    #050507;
  color: #f8f8ff;
  min-height: 100vh;
}

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }
    
.vira-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}

.vira-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.vira-mark {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: linear-gradient(135deg, #9333ea, #2563eb);
  box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
  color: white;
  font-size: 24px;
  font-weight: 900;
}

.credit-badge {
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(139, 92, 246, 0.35);
  background: rgba(15, 15, 23, 0.85);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
    .logo {
  text-align: center;
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 10%, #a78bfa 55%, #60a5fa 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
letter-spacing: 1.5px;
      margin-bottom: 18px;
    }

.card {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
  box-shadow: none;
}

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid #333342;
      border-radius: 14px;
      background: #0d0d13;
      color: white;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
#scenario {
  padding: 18px 20px;
  border-radius: 18px;

  background: linear-gradient(
    135deg,
    rgba(139, 92, 246, 0.34),
    rgba(109, 40, 217, 0.20)
  );

  border: 1px solid rgba(168, 85, 247, 0.90);

  color: #ffffff;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.2px;

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.12),
    0 0 22px rgba(139, 92, 246, 0.30),
    0 8px 30px rgba(76, 29, 149, 0.20);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    border-color 0.18s ease;
}

#scenario:hover {
  border-color: rgba(192, 132, 252, 1);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    0 0 30px rgba(168, 85, 247, 0.42),
    0 10px 35px rgba(76, 29, 149, 0.28);
}

#scenario:active {
  transform: scale(0.98);
}
    button:disabled {
      opacity: 0.6;
    }

    #status {
    
  margin-top: 18px;
  padding: 14px 16px;

  text-align: center;

  color: #c4b5fd;
  font-size: 14px;
  font-weight: 700;

  background: rgba(124, 58, 237, 0.08);
  border: 1px solid rgba(139, 92, 246, 0.18);
  border-radius: 14px;

  line-height: 1.4;
}
#status:empty {
  display: none;
}
    #result {
      margin-top: 25px;
      text-align: center;
    }

    #result img {
      max-width: 100%;
      border-radius: 15px;
    }
    .marketing-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0 18px;
}

.marketing-choice {
  position: relative;
  width: 100%;
  min-height: 158px;
  margin: 0;
  padding: 14px 10px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;

  text-align: center;

  border: 1px solid #292b38;
  border-radius: 14px;

  background: linear-gradient(
    180deg,
    #0d0e14 0%,
    #090a0f 100%
  );

  color: #ffffff;

  box-shadow: none;

  transition:
    border-color .18s ease,
    box-shadow .18s ease,
    transform .18s ease;
}

.marketing-choice:hover {
  transform: translateY(-2px);
  border-color: rgba(139,92,246,.55);
  box-shadow: 0 10px 24px rgba(0,0,0,.24);
}

.marketing-choice.active {
  border-color: rgba(168, 85, 247, 0.95);
  background:
    linear-gradient(
      145deg,
      rgba(91, 33, 182, 0.92),
      rgba(79, 70, 229, 0.88)
    );
  box-shadow:
    0 14px 34px rgba(124, 58, 237, 0.30),
    inset 0 1px 0 rgba(255,255,255,0.14);
  transform: translateY(-1px);
}
    .campaign-result {
  margin-top: 20px;
  text-align: left;
}
.campaign-dashboard {
  margin-top: 28px;
  padding: 20px;
  border-radius: 20px;
  background:
    linear-gradient(145deg, rgba(139, 92, 246, 0.08), rgba(8, 8, 14, 0.96));
  border: 1px solid rgba(139, 92, 246, 0.22);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.04),
    0 20px 50px rgba(0, 0, 0, 0.30);
}
  .campaign-dashboard:empty {
  display: none;
  }
    .result-ready {
  margin-bottom: 18px;
      
  padding: 14px 16px;
  border-radius: 16px;
  background:
    linear-gradient(
      135deg,
      rgba(34, 197, 94, 0.08),
      rgba(139, 92, 246, 0.05)
    );
  border: 1px solid rgba(34, 197, 94, 0.18);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

.result-ready strong {
  display: block;
  color: #f8fafc;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 4px;
}

.result-ready span {
  color: #9ca3af;
  font-size: 13px;
  line-height: 1.4;
}
    .campaign-dashboard .campaign-section {
  margin-top: 14px;
  padding: 16px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(139, 92, 246, 0.14);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
}

.campaign-dashboard .campaign-section:first-child {
  margin-top: 0;
}

.campaign-dashboard .campaign-section strong {
  color: #ffffff;
  font-weight: 800;
}

.campaign-dashboard .campaign-section p {
  color: #c7cad6;
}
   .result-preview-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0 10px;
  color: #f8fafc;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.2px;
}

.result-preview-title::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #a855f7;
  box-shadow: 0 0 12px rgba(168, 85, 247, 0.55);
} 
.result-label {
  display: flex;
  align-items: center;
  gap: 10px;
}

.result-icon {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  color: #c084fc;
  font-size: 15px;
  font-weight: 900;
  background: linear-gradient(
    135deg,
    rgba(168, 85, 247, 0.18),
    rgba(99, 102, 241, 0.08)
  );
  border: 1px solid rgba(168, 85, 247, 0.32);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.05),
    0 0 14px rgba(168, 85, 247, 0.12);
}
.campaign-result h2 {
  margin: 0 0 20px;
  font-size: 26px;
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: -0.5px;

  background: linear-gradient(
    135deg,
    #ffffff,
    #c4b5fd 55%,
    #60a5fa
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.campaign-dashboard .campaign-section h3,
.campaign-dashboard .campaign-section summary {
  color: #f8fafc;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.2px;
}

.campaign-dashboard .campaign-section h3::before,
.campaign-dashboard .campaign-section summary::before {
  content: "•";
  color: #a855f7;
  margin-right: 8px;
}
.campaign-section p {
  margin: 0;
  color: #d1d5db;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre-line;
}
    .campaign-section {
  position: relative;

  background: linear-gradient(
    145deg,
    rgba(25, 28, 42, 0.96),
    rgba(13, 15, 24, 0.98)
  );

  border: 1px solid rgba(139, 92, 246, 0.16);
  border-radius: 18px;

  padding: 18px;
  margin-top: 14px;

  box-shadow:
    0 10px 28px rgba(0, 0, 0, 0.24),
    inset 0 1px 0 rgba(255, 255, 255, 0.03);

  transition:
    transform 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease;
}

.campaign-section:hover {
  transform: translateY(-2px);
  border-color: rgba(139, 92, 246, 0.38);

  box-shadow:
    0 14px 32px rgba(0, 0, 0, 0.3),
    0 0 0 1px rgba(139, 92, 246, 0.05);
}

.campaign-section strong {
  display: block;
  margin-bottom: 8px;

  color: #a78bfa;

  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
  


.campaign-details {
  display: grid;
  gap: 10px;
  margin-top: 15px;
  margin-bottom: 15px;
}

.campaign-details input,
.campaign-details select {
  width: 100%;
  padding: 16px;
  background: rgba(10, 11, 18, 0.9);
  border: 1px solid #303345;
  border-radius: 16px;
  color: #f8fafc;
  font-size: 15px;
  box-sizing: border-box;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.campaign-details input:focus,
.campaign-details select:focus {
  outline: none;
  border-color: #8b5cf6;
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.14);
}
    /* Sections repliables de la campagne */
.campaign-collapsible {
  padding: 0;
  overflow: hidden;
}

.campaign-collapsible summary {
  padding: 18px;
  cursor: pointer;
  list-style: none;
  color: #a78bfa;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.campaign-collapsible summary::-webkit-details-marker {
  display: none;
}

.campaign-collapsible summary::after {
  content: "＋";
  font-size: 22px;
  color: #8b5cf6;
  transition: transform 0.2s ease;
}

.campaign-collapsible[open] summary::after {
  content: "−";
}

.collapsible-content {
  padding: 0 18px 18px;
  border-top: 1px solid rgba(139, 92, 246, 0.12);
}

.collapsible-content p {
  padding-top: 16px;
}

.scene-item {
  padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.scene-item:last-child {
  border-bottom: none;
}

.scene-item strong {
  color: #c4b5fd;
  margin-bottom: 8px;
}


/* Bouton valider la campagne */
#validateScenario {
  margin-top: 16px;
  padding: 17px 20px;
  border-radius: 18px;
  background: linear-gradient(135deg, #16a34a 0%, #22c55e 55%, #15803d 100%);
  color: white;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 10px 26px rgba(34, 197, 94, 0.22);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

#validateScenario:active {
  transform: scale(0.98);
}
#testVoice {
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.22);
}

#generate {
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  box-shadow: 0 10px 24px rgba(234, 88, 12, 0.22);
}

#video {
  background: linear-gradient(135deg, #ec4899, #7c3aed);
  box-shadow: 0 10px 24px rgba(124, 58, 237, 0.24);
}

#testVoice,
#generate,
#video {
  padding: 17px 20px;
  border-radius: 18px;
  font-size: 16px;
  font-weight: 800;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

#testVoice:active,
#generate:active,
#video:active {
  transform: scale(0.98);
}
    
 .campaign-details {
  display: grid;
  gap: 14px;
  margin-top: 18px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.field-group label {
  margin: 0;

}

.field-group input,

  .description-field {
  position: relative;
}

.description-field textarea {
  width: 100%;

  resize: vertical;

.description-field textarea:focus {

.char-count {

.tone-field select {

  function getRawScenario() {

function renderMarketingScenario(scenario) {
  scenarioResult.dataset.rawScenario = scenario;
const cleanScenario = scenario
  .replace(/\*\*/g, "")
  .replace(/^#+\s*/gm, "")
  .replace(/\s+:/g, ":")
  .replace(/SCENE/gi, "SCÈNE")
  .trim();
const sectionHeaders = [
  "TITRE",
  "OBJECTIF",
  "PUBLIC CIBLE",
  "ACCROCHE",
  "TEXTE PUBLICATION",
  "HASHTAGS",
  "SCÈNE 1",
  "SCÈNE 2",
  "SCÈNE 3",
  "SCÈNE 4",
  "SCÈNE 5",
  "NARRATION",
  "APPEL À L'ACTION",
  "APPEL À L’ACTION",
  "PROMPT VISUEL",
  "STYLE"
];

const escapeRegex = (text) =>
  text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

const extractSection = (name) => {
  const start = escapeRegex(name).replace(/'/g, "['’]");
  const nextHeaders = sectionHeaders
    .filter((header) => header !== name)
    .map((header) =>
      escapeRegex(header).replace(/'/g, "['’]")
     ) 
    .join("|");

  const regex = new RegExp(
    `${start}\\s*:?\\s*([\\s\\S]*?)(?=\\s+(?:${nextHeaders})\\s*:?|$)`
  );

  return cleanScenario.match(regex)?.[1]?.trim() || "";
};

const objective = extractSection("OBJECTIF", ["PUBLIC CIBLE"]);
const target = extractSection("PUBLIC CIBLE", ["ACCROCHE"]);

const publication = extractSection("TEXTE PUBLICATION", ["HASHTAGS"]);
const hashtags = extractSection("HASHTAGS", ["SCÈNE 1"]);
const narration = extractSection("NARRATION", ["APPEL À L'ACTION"]);
const cta = extractSection("APPEL À L'ACTION", ["PROMPT VISUEL"]);
const visualPrompt = extractSection("PROMPT VISUEL", ["STYLE"]);
const style = extractSection("STYLE", []);

const scenes = [];

for (let i = 1; i <= 5; i++) {
  const regex = new RegExp(
    `SCÈNE ${i}:?\\s*([\\s\\S]*?)(?=SCÈNE ${i + 1}:?|NARRATION:?|APPEL À L['’]ACTION:?|PROMPT VISUEL:?|STYLE:?|$)`,
    "i"
  );

  const match = cleanScenario.match(regex);

  if (match?.[1]?.trim()) {
    scenes.push(match[1].trim());

    const finished = statuses.filter(
      item => item?.status === "SUCCEEDED"
    ).length;
const runwayResults =
  document.getElementById("runwayResults");

if (runwayResults) {
  const completedVideos = statuses
    .filter(
      item =>
        item?.status === "SUCCEEDED" &&
        Array.isArray(item?.output) &&
        item.output.length > 0
    )
    .map(
      (item, index) => `
        <div style="margin-top:12px;">
          <div style="margin-bottom:6px;">
            🎬 Scène ${index + 1}
          </div>
          <video
            controls
            playsinline
            style="width:100%;border-radius:12px;"
            src="${item.output[0]}"
          ></video>
        </div>
      `
    )
    .join("");

  if (completedVideos) {
    runwayResults.innerHTML = completedVideos;
  }
  }
    videoStatus.textContent =
      `⏳ ${finished}/${submittedClips.length} vidéos Runway terminées`;
const allSucceeded =
  statuses.length === 5 &&
  statuses.every(
    item =>
      item?.status === "SUCCEEDED" &&
      Array.isArray(item?.output) &&
      item.output.length > 0
  );

if (allSucceeded) {
  const videoUrls = statuses.map(
    item => item.output[0]
  );

  videoStatus.textContent =
    "🎬 Assemblage de la vidéo finale...";

  const assembleResponse = await fetch(
    "/api/video/assemble",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        videoUrls
      })
    }
  );

  if (!assembleResponse.ok) {
    throw new Error(
      "Impossible d'assembler la vidéo finale."
    );
  }

  const finalVideoBlob =
    await assembleResponse.blob();
window.viraFinalVideoBlob = finalVideoBlob;
  const finalVideoUrl =
    URL.createObjectURL(finalVideoBlob);

  runwayResults.innerHTML = `
    <video
      controls
      playsinline
      style="width:100%;border-radius:12px;"
      src="${finalVideoUrl}"
    ></video>
  `;

  videoStatus.textContent =
    "✅ Vidéo finale prête";

  return;
  }
    const allFinished = statuses.every(
      item =>
        item?.status === "SUCCEEDED" ||
        item?.status === "FAILED" ||
        item?.status === "CANCELED"
    );

    if (!allFinished) {
      setTimeout(pollRunway, 5000);
    }
  } catch (error) {
    console.error("RUNWAY POLL ERROR:", error);
  }
};

pollRunway();
      }
const voiceButton = document.createElement("button");
voiceButton.type = "button";
voiceButton.textContent = "🎙️ Générer la voix";
voiceButton.style.display = "block";
voiceButton.style.width = "100%";
voiceButton.style.marginTop = "15px";
voiceButton.style.padding = "15px";
voiceButton.style.borderRadius = "15px";
voiceButton.style.border = "none";
voiceButton.style.cursor = "pointer";

voiceButton.onclick = async () => {
try {
const scenario = getRawScenario();
const narrationMatch = scenario.match(
  /NARRATION:\s*([\s\S]*?)(?=STYLE:|$)/i
);

const fullNarration = narrationMatch
  ? narrationMatch[1].trim()
  : scenario;

const narration = fullNarration;
if (!scenario || scenario === "Scénario reçu.") {
    alert("⚠️ Crée d'abord un scénario.");
    return;
}
    voiceButton.disabled = true;
    voiceButton.textContent = "🎙️ Génération de la voix...";

const voiceResponse = await fetch("/api/voice/generate", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    text: narration
  })
});

if (!voiceResponse.ok) {
  let errorMessage = "Erreur lors de la génération de la voix.";

  try {
    const errorData = await voiceResponse.json();
    errorMessage = errorData?.error || errorMessage;
  } catch {}

  throw new Error(errorMessage);
}

const audioBlob = await voiceResponse.blob();
  if (window.viraFinalVideoBlob) {
  const formData = new FormData();

  formData.append(
    "video",
    window.viraFinalVideoBlob,
    "VIRA-video.mp4"
  );

  formData.append(
    "audio",
    audioBlob,
    "VIRA-voice.mp3"
  );

  const mergeResponse = await fetch(
    "/api/video/merge",
    {
      method: "POST",
      body: formData
    }
  );

  if (!mergeResponse.ok) {
    throw new Error(
      "Impossible d'ajouter la voix à la vidéo."
    );
  }

  const narratedVideoBlob =
    await mergeResponse.blob();

  const narratedVideoUrl =
    URL.createObjectURL(narratedVideoBlob);

  const runwayResults =
    document.getElementById("runwayResults");

  if (runwayResults) {
    runwayResults.innerHTML = `
      <video
        controls
        playsinline
        style="width:100%;border-radius:12px;"
        src="${narratedVideoUrl}"
      ></video>

      <a
        href="${narratedVideoUrl}"
        download="VIRA-final.mp4"
        style="
          display:block;
          margin-top:12px;
          text-align:center;
        "
      >
        ⬇️ Télécharger la vidéo finale
      </a>
    `;
  }

  videoStatus.textContent =
    "✅ Vidéo finale avec narration prête";
  }
const audioUrl = URL.createObjectURL(audioBlob);

document.getElementById("voiceResult")?.remove();

const voiceResult = document.createElement("div");
voiceResult.id = "voiceResult";
voiceResult.style.marginTop = "15px";

const audioPlayer = document.createElement("audio");
audioPlayer.src = audioUrl;
audioPlayer.controls = true;
audioPlayer.style.width = "100%";

const voiceDownload = document.createElement("a");
voiceDownload.href = audioUrl;
voiceDownload.download = "VIRA-voice.mp3";
voiceDownload.textContent = "⬇️ Télécharger la voix";
voiceDownload.style.display = "block";
voiceDownload.style.marginTop = "12px";
voiceDownload.style.textAlign = "center";

voiceResult.appendChild(audioPlayer);
voiceResult.appendChild(voiceDownload);
videoResult.appendChild(voiceResult);

voiceButton.disabled = false;
voiceButton.textContent = "✅ Voix prête";
  } catch (error) {
    console.error("VIRA VOICE ERROR:", error);

    voiceButton.disabled = false;
    voiceButton.textContent = "🎙️ Générer la voix";

    alert(
      "Erreur lors de la génération de la voix : " +
      error.message
    );
  }
};

videoResult.appendChild(voiceButton);
} catch (error) {

      console.error("VIRA VIDEO ERROR:", error);

      videoStatus.textContent =
        "❌ " + error.message;

    } finally {
clearInterval(progressTimer);
      videoButton.disabled = false;    }
  });  


});
</script>
      </div> <!-- fin app-shell -->
