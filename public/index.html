<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VIRA – Création vidéo IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b10;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
    }

    .card {
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 20px;
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid #333342;
      border-radius: 14px;
      background: #0d0d13;
      color: white;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      color: #aaa;
    }

    #result {
      margin-top: 25px;
      text-align: center;
    }

    #result img {
      max-width: 100%;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">VIRA</div>

    <div class="subtitle">
      Crée tes contenus avec l'intelligence artificielle
    </div>

    <div class="card">

      <label for="prompt">
        Décris ton idée
      </label>

      <textarea
        id="prompt"
        placeholder="Exemple : Une ville futuriste sous la pluie..."
      ></textarea>
<button id="scenario" type="button">
  🎬 Créer le scénario
</button>

<div id="scenarioStatus"></div>

<div id="scenarioResult"></div>
      <button id="generate" type="button">
        ✨ Générer
      </button>
<button id="video" type="button">
  🎥 Créer la vidéo
</button>

<div id="videoStatus"></div>
<div id="videoResult"></div>
      <div id="status"></div>

      <div id="result"></div>

    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const button = document.getElementById("generate");
      const promptInput = document.getElementById("prompt");
      const status = document.getElementById("status");
      const result = document.getElementById("result");


const scenarioButton = document.getElementById("scenario");
const scenarioStatus = document.getElementById("scenarioStatus");
const scenarioResult = document.getElementById("scenarioResult");
      const videoButton = document.getElementById("video");
scenarioButton.addEventListener("click", async function () {
    const idea = promptInput.value.trim();

    if (!idea) {
        scenarioStatus.textContent = "⚠️ Écris une idée avant de créer le scénario.";
        return;
    }

    scenarioButton.disabled = true;
    scenarioStatus.textContent = "⏳ Création du scénario...";
    scenarioResult.textContent = "";

    try {
        const response = await fetch("/api/scenario/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idea: idea
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Erreur de création du scénario.");
        }

        scenarioStatus.textContent = "✅ Scénario créé !";
        scenarioResult.textContent = data.scenario || data.output_text || "Scénario reçu.";

    } catch (error) {
        console.error("VIRA SCENARIO ERROR:", error);
        scenarioStatus.textContent = "❌ " + error.message;
    } finally {
        scenarioButton.disabled = false;
    }
videoButton.addEventListener("click", async function () {

    const scenario = scenarioResult.textContent.trim();

    if (!scenario || scenario === "Scénario reçu.") {
        videoStatus.textContent = "⚠️ Crée d'abord un scénario.";
        return;
    }

    videoButton.disabled = true;
    videoStatus.textContent = "🎬 Création de la vidéo...";
    videoResult.innerHTML = "";

    try {

        const response = await fetch("/api/video/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                scenario: scenario,
                size: "720x1280",
                seconds: "10"
            })
        });

        const data = await response.json();

        console.log("VIRA VIDEO RESPONSE:", data);

        if (!response.ok) {
            throw new Error(
                data?.error?.message ||
                data?.error ||
                data?.message ||
                "Erreur lors de la création de la vidéo."
            );
        }

        const videoUrl =
            data?.video?.url ||
            data?.url ||
            data?.videoUrl ||
            data?.video_url;

        if (!videoUrl) {
            throw new Error("Aucune vidéo reçue du serveur.");
        }

        videoStatus.textContent = "✅ Vidéo créée !";

        videoResult.innerHTML = `
            <video
                src="${videoUrl}"
                controls
                playsinline
                style="width:100%;border-radius:16px;margin-top:15px;">
            </video>
        `;

    } catch (error) {

        console.error("VIRA VIDEO ERROR:", error);

        videoStatus.textContent = "❌ " + error.message;

    } finally {

        videoButton.disabled = false;

    }

});
});
</script>
