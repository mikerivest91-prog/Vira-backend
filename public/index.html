
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VIRA – Création vidéo IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b10;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
    }

    .card {
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 20px;
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid #333342;
      border-radius: 14px;
      background: #0d0d13;
      color: white;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      color: #aaa;
    }

    #result {
      margin-top: 25px;
      text-align: center;
    }

    #result img {
      max-width: 100%;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">VIRA</div>

    <div class="subtitle">
      Crée tes contenus avec l'intelligence artificielle
    </div>

    <div class="card">

      <label for="prompt">
        Décris ton idée
      </label>

      <textarea
        id="prompt"
        placeholder="Exemple : Une ville futuriste sous la pluie..."
      ></textarea>
<button id="scenario" type="button">
  🎬 Créer le scénario
</button>

<div id="scenarioStatus"></div>

<div id="scenarioResult"></div>
     <button id="validateScenario" type="button" disabled>
  ✅ Valider le scénario
     </button> 
      <button id="generate" type="button">
        ✨ Générer
      </button>
<button id="video" type="button">
  🎥 Créer la vidéo
</button>

<div id="videoStatus"></div>
<div id="videoResult"></div>
      <div id="status"></div>

      <div id="result"></div>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const button = document.getElementById("generate");
  const promptInput = document.getElementById("prompt");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  const scenarioButton = document.getElementById("scenario");
  const scenarioStatus = document.getElementById("scenarioStatus");
  const scenarioResult = document.getElementById("scenarioResult");
const validateScenario = document.getElementById("validateScenario");
  // Restaurer le dernier scénario après actualisation
const savedScenario = localStorage.getItem("viraScenario");
const savedIdea = localStorage.getItem("viraIdea");

if (savedIdea) {
  promptInput.value = savedIdea;
}
if (savedScenario) {
  scenarioResult.textContent = savedScenario;
  scenarioStatus.textContent = "✅ Scénario restauré.";
  validateScenario.disabled = false;
}
  const videoButton = document.getElementById("video");
  const videoStatus = document.getElementById("videoStatus");
  const videoResult = document.getElementById("videoResult");


  /* =========================
     CRÉER LE SCÉNARIO
  ========================= */

  scenarioButton.addEventListener("click", async function () {

    const idea = promptInput.value.trim();
localStorage.setItem("viraIdea", idea);
    if (!idea) {
      scenarioStatus.textContent =
        "⚠️ Écris une idée avant de créer le scénario.";
      return;
    }

    scenarioButton.disabled = true;
    scenarioStatus.textContent = "⏳ Création du scénario...";
    scenarioResult.textContent = "";

    try {

      const response = await fetch("/api/scenario/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          idea: idea
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data?.error?.message ||
          data?.error ||
          "Erreur lors de la création du scénario."
        );
      }

const scenario = data?.scenario || data?.output_text || "";
      if (!scenario) {
        throw new Error("Aucun scénario reçu du serveur.");
      }

      scenarioStatus.textContent = "✅ Scénario créé !";
scenarioResult.textContent = scenario;
      validateScenario.disabled = false;
localStorage.setItem("viraScenario", scenario);

} catch (error) {

console.error("VIRA SCENARIO ERROR:", error);

scenarioStatus.textContent =
"❌ " + error.message;

} finally {

scenarioButton.disabled = false;

}

  });
// =========================
// VALIDER LE SCÉNARIO
// =========================

validateScenario.addEventListener("click", function () {
    const scenario = scenarioResult.textContent.trim();

    if (!scenario) {
        scenarioStatus.textContent = "⚠️ Aucun scénario à valider.";
        return;
    }

    scenarioStatus.textContent = "✅ Scénario validé !";
    validateScenario.textContent = "✅ Scénario validé";
    validateScenario.disabled = true;
});
  /* =========================
     GÉNÉRER LES IMAGES
  ========================= */

  button.addEventListener("click", async function () {

    const scenario = scenarioResult.textContent.trim();

    if (!scenario || scenario === "Scénario reçu.") {
      status.textContent =
        "⚠️ Crée d'abord un scénario.";
      return;
    }

    button.disabled = true;
    status.textContent = "🎬 Génération des 5 scènes...";
    result.innerHTML = "";

    try {

      const scenes = scenario
  .split(/(?=##\s*Scène\s*[1-5])/i)
  .map(scene => scene.trim())
  .filter(scene => scene.length > 20)
  .slice(0, 5);

      if (scenes.length === 0) {
        throw new Error(
          "Aucune scène trouvée dans le scénario."
        );
      }

      const continuityPrompt = `
VISUAL CONTINUITY RULES:

Create all images as frames from the SAME cinematic story.

Keep these elements CONSISTENT in every scene:
- same main character
- same face and identity
- same hairstyle
- same age
- same body proportions
- same clothing and accessories
- same environment and world
- same cinematic style
- same realistic visual quality
- same color grading
- same lighting style

The main character must look like the SAME PERSON in every scene.
Do not randomly change the character, clothing, age, face or hairstyle.

Each image must visually continue the previous scene.

Use a cinematic realistic film-still look.
Vertical 9:16 composition.
Highly detailed.
Natural realistic lighting.
Professional cinematography.
`;

for (let i = 0; i < scenes.length; i++) {

  status.textContent =
    `🎬 Génération de la scène ${i + 1}/${scenes.length}...`;

  const scenePrompt = `
${continuityPrompt}

STORY CONTEXT:
${scenario}

CURRENT SCENE ${i + 1}:
${scenes[i]}

Create this scene as part of the same continuous movie.
Maintain perfect visual continuity with the other scenes.
`;

  const response = await fetch(
    "/api/images/generate",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: scenePrompt,
        size: "1024x1536",
        quality: "low"
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data?.error?.message ||
      data?.error ||
      `Erreur de génération de l'image ${i + 1}.`
    );
  }

  const imageUrl =
    data?.url ||
    data?.image?.url ||
    data?.data?.[0]?.url;

  if (!imageUrl) {
    throw new Error(
      `Aucune image reçue pour la scène ${i + 1}.`
    );
  }

  const img = document.createElement("img");

  img.src = imageUrl;
  img.alt = `Scène ${i + 1}`;
  img.style.width = "100%";
  img.style.borderRadius = "15px";
  img.style.marginTop = "15px";

  result.appendChild(img);
}

      status.textContent = "✅ Images générées !";

    } catch (error) {

      console.error("VIRA IMAGE ERROR:", error);

      status.textContent =
        "❌ " + error.message;

    } finally {

      button.disabled = false;

    }

  });


  /* =========================
     CRÉER LA VIDÉO
  ========================= */

  videoButton.addEventListener("click", async function () {

    const scenario = scenarioResult.textContent.trim();

    if (!scenario || scenario === "Scénario reçu.") {
      videoStatus.textContent =
        "⚠️ Crée d'abord un scénario.";
      return;
    }

    videoButton.disabled = true;
    videoResult.innerHTML = "";

let progress = 0;

videoStatus.textContent =
  "🎥 Création de la vidéo... 0 %";

const progressTimer = setInterval(() => {
  if (progress < 99) {
    progress += progress < 80 ? 5 : 1;

    videoStatus.textContent =
      `🎥 Création de la vidéo... ${progress} %`;
  }
}, 5000);
    try {

      const response = await fetch(
        "/api/video/generate",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
          prompt: scenario
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data?.error?.message ||
          data?.error ||
          "Erreur lors de la création de la vidéo."
        );
      }

      const videoUrl =
        data?.video?.url ||
        data?.url ||
        data?.videoUrl ||
        data?.video_url;
      
      if (!videoUrl) {
        throw new Error(
          "Aucune vidéo reçue du serveur."
        );
      }
localStorage.setItem("viraVideoUrl", videoUrl);
      videoStatus.textContent =
        "✅ Vidéo créée !";

      videoResult.innerHTML = `
        <video
          src="${videoUrl}"
          controls
          playsinline
          style="width:100%;border-radius:16px;margin-top:15px;">
        </video>
      `;
const downloadButton = document.createElement("a");
downloadButton.href = videoUrl;
downloadButton.download = "VIRA-video.mp4";
downloadButton.textContent = "⬇️ Télécharger la vidéo";
downloadButton.style.display = "block";
downloadButton.style.marginTop = "15px";
downloadButton.style.padding = "15px";
downloadButton.style.background = "#7c3aed";
downloadButton.style.color = "white";
downloadButton.style.textAlign = "center";
downloadButton.style.borderRadius = "15px";
downloadButton.style.textDecoration = "none";
downloadButton.style.fontWeight = "bold";

videoResult.appendChild(downloadButton);
const voiceButton = document.createElement("button");
voiceButton.type = "button";
voiceButton.textContent = "🎙️ Générer la voix";
voiceButton.style.display = "block";
voiceButton.style.width = "100%";
voiceButton.style.marginTop = "15px";
voiceButton.style.padding = "15px";
voiceButton.style.borderRadius = "15px";
voiceButton.style.border = "none";
voiceButton.style.cursor = "pointer";

voiceButton.onclick = async () => {
try {
const scenario = scenarioResult.textContent.trim();

if (!scenario || scenario === "Scénario reçu.") {
    alert("⚠️ Crée d'abord un scénario.");
    return;
}
    voiceButton.disabled = true;
    voiceButton.textContent = "🎙️ Génération de la voix...";

    const response = await fetch("/api/voice/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: scenario
      })
    });

    if (!response.ok) {
  const errorText = await response.text();
  throw new Error(errorText || "Impossible de générer la voix.");
}

const audioBlob = await response.blob();
const audioUrl = URL.createObjectURL(audioBlob);

const audioPlayer = document.createElement("audio");
audioPlayer.src = audioUrl;
audioPlayer.controls = true;
audioPlayer.style.width = "100%";
audioPlayer.style.marginTop = "15px";

videoResult.appendChild(audioPlayer);

const downloadVoiceButton = document.createElement("a");
downloadVoiceButton.href = audioUrl;
downloadVoiceButton.download = "VIRA-voix.mp3";
downloadVoiceButton.textContent = "⬇️ Télécharger la voix";
downloadVoiceButton.style.display = "block";
downloadVoiceButton.style.marginTop = "15px";
downloadVoiceButton.style.padding = "15px";
downloadVoiceButton.style.borderRadius = "15px";
downloadVoiceButton.style.textAlign = "center";
downloadVoiceButton.style.textDecoration = "none";

videoResult.appendChild(downloadVoiceButton);

voiceButton.disabled = false;
voiceButton.textContent = "✅ Voix générée";
  } catch (error) {
    console.error("VIRA VOICE ERROR:", error);

    voiceButton.disabled = false;
    voiceButton.textContent = "🎙️ Générer la voix";

    alert(
      "Erreur lors de la génération de la voix : " +
      error.message
    );
  }
};

videoResult.appendChild(voiceButton);
} catch (error) {

      console.error("VIRA VIDEO ERROR:", error);

      videoStatus.textContent =
        "❌ " + error.message;

    } finally {
clearInterval(progressTimer);
      videoButton.disabled = false;    }
  });  


});
</script>
</body>
</html>
