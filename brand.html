<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identité de marque · Olyvex</title><style>body{font:16px system-ui;color:#263249;background:#f5f6fa;margin:0}main{max-width:850px;padding:24px;margin:auto}section{padding:24px;background:white;border:1px solid #dce2ed;border-radius:16px;margin:20px 0}label{display:block;margin:16px 0}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c4dc;border-radius:8px;font:inherit}input[type=color]{height:48px}button{padding:12px 18px;border:1px solid #7444d5;border-radius:8px;background:#7444d5;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{max-width:180px;max-height:100px;object-fit:contain}a{color:#6537b8}#preview{border-top:6px solid #7444d5;overflow-wrap:anywhere}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="/">← Retour à Olyvex</a><h1>Votre identité de marque</h1><p>Enregistrez les informations de votre commerce. Elles seront conservées avec vos nouvelles campagnes. Le logo et les couleurs ne sont pas encore ajoutés automatiquement aux vidéos.</p><form id="brand"><section><label>Logo du commerce<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="removeLogo" type="button">Retirer le logo</button><div class="grid"><div><label>Nom du commerce<input name="name" maxlength="100"></label><label>Slogan<input name="tagline" maxlength="160"></label><label>Courriel public<input name="email" type="email" maxlength="254"></label><label>Téléphone<input name="phone" maxlength="40"></label></div><div><label>Adresse du commerce<input name="address" maxlength="240"></label><label>Site web<input name="website" type="url" placeholder="https://" maxlength="300"></label><label>Couleur principale<input name="primaryColor" type="color" value="#7444d5"></label><label>Couleur secondaire<input name="secondaryColor" type="color" value="#263249"></label></div></div><button id="save" disabled>Enregistrer</button><p id="status" role="status" aria-live="polite">Chargement…</p></section></form><section id="preview"><h2>Aperçu de votre marque</h2><img id="logoPreview" alt="Logo de votre commerce" hidden><h3 id="namePreview"></h3><p id="taglinePreview"></p><p id="contactPreview"></p></section></main><script>(()=>{'use strict';const form=document.getElementById('brand'),status=document.getElementById('status'),save=document.getElementById('save');let logo='',importing=false;const fields=['name','tagline','email','phone','address','website','primaryColor','secondaryColor'];const value=()=>Object.fromEntries(fields.map(f=>[f,form.elements.namedItem(f).value]));function preview(){const b=value();document.getElementById('preview').style.borderTopColor=b.primaryColor;document.getElementById('namePreview').style.color=b.secondaryColor;for(const f of ['name','tagline'])document.getElementById(f+'Preview').textContent=b[f];document.getElementById('contactPreview').textContent=[b.email,b.phone,b.address,b.website].filter(Boolean).join(' · ');const img=document.getElementById('logoPreview');img.hidden=!logo;if(logo)img.src=logo;else img.removeAttribute('src');}form.addEventListener('input',preview);document.getElementById('removeLogo').onclick=()=>{logo='';document.getElementById('logoFile').value='';preview();};document.getElementById('logoFile').onchange=async event=>{const file=event.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>10*1024*1024){status.textContent='Choisissez une image PNG, JPEG ou WebP de moins de 10 Mo.';return;}importing=true;save.disabled=true;try{const bitmap=await createImageBitmap(file);const scale=Math.min(1,512/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const candidate=canvas.toDataURL('image/png');if(candidate.length>500000)throw Error('Logo trop détaillé. Choisissez une image plus simple.');logo=candidate;preview();status.textContent='Logo prêt. Enregistrez vos modifications.';}catch(error){status.textContent=error.message;}finally{importing=false;save.disabled=false;}};form.onsubmit=async event=>{event.preventDefault();if(importing)return;save.disabled=true;try{const response=await fetch('/api/brand',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({...value(),logo})});const data=await response.json();if(!response.ok)throw Error(data.error||'Enregistrement impossible.');status.textContent='Identité enregistrée sur votre compte.';}catch(error){status.textContent=error.message;}finally{save.disabled=false;}};fetch('/api/brand',{credentials:'same-origin',cache:'no-store'}).then(async response=>{if(!response.ok)throw Error(response.status===401?'Connectez-vous à Olyvex, puis revenez ici.':'Chargement impossible. Rechargez la page.');return response.json();}).then(data=>{if(data.brand){for(const f of fields)form.elements.namedItem(f).value=data.brand[f]||'';logo=data.brand.logo||'';}preview();save.disabled=false;status.textContent='Vos informations sont privées à votre compte, sauf lorsque vous les utilisez dans un contenu partagé.';}).catch(error=>{status.textContent=error.message;});})();</script></body></html>
